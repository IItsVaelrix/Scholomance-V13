app = "scholomance-v12"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"

  # HEAP CEILING, STATED. Nothing set --max-old-space-size, so V8 derived its
  # own limit from machine memory: production died at "249.0 (257.0) MB" on a
  # 512mb VM. Nobody chose 257. With vm.memory now 1024, the ceiling is declared
  # rather than inherited, so changing the VM size can never silently move it.
  #
  # --heapsnapshot-near-heap-limit=1 writes ONE snapshot just before V8 aborts.
  # This is the only way to get a JS-level view of an OOM: the abort itself runs
  # no JavaScript, which is why the subtlety ledger recorded nothing for any of
  # the 2026-08-14 crashes. --diagnostic-dir puts it on the volume; the default
  # is cwd, which is ephemeral and would be lost in the reboot that follows.
  NODE_OPTIONS = "--max-old-space-size=768 --heapsnapshot-near-heap-limit=1 --diagnostic-dir=/var/data/diagnostics"
  TRUST_PROXY = "true"
  ENABLE_COLLAB_API = "true"

  # The dictionary and corpus are IMMUTABLE BUILD ARTIFACTS: the Dockerfile builds
  # them into /app/data and then rewrites the rhyme index from the canonical rhyme
  # domain. These used to point at /var/data — the mounted volume — which the image
  # build never writes, so production was reading a dictionary that was not there.
  # That is one of the two reasons prod silently served every word lookup from the
  # public APIs instead of the local dict. A volume is for mutable state; this is not.
  SCHOLOMANCE_DICT_PATH = "/app/data/scholomance_dict.sqlite"
  SCHOLOMANCE_CORPUS_PATH = "/app/data/scholomance_corpus.sqlite"

  # The other reason. wordLookup.service consults the local dictionary only when
  # this is set; unset, resolveScholomanceDictApiUrl() returns null and every lookup
  # falls straight through to Datamuse + Free Dictionary. Those are good at MEANING
  # (definitions, synonyms, antonyms) and bad at SOUND (94.4% rhyme accuracy, 12.5%
  # junk like "sarong"/"waive", 8.6% not even words: "hand in glove"). The local dict
  # is 100% on rhymes with 0% junk. Setting this makes prod use the local dict for
  # sound and merge the external APIs in for meaning — mergeWithExternalIfSparse.
  SCHOLOMANCE_DICT_API_URL = "http://localhost:8080/api/lexicon"

  # Mutable output still belongs on the volume.
  RHYME_ASTROLOGY_OUTPUT_DIR = "/var/data/rhyme-astrology"

  # APM reports were the other half of the 2026-08-14 outage. Unset, this fell
  # back to <root>/divtube_downloader/APM-Hourly-Reports — a path that is in
  # .dockerignore, so it is not even in the image, and is wiped every reboot.
  # The ledger meanwhile persists here on the volume. Reports are what the
  # reporter used to read back to decide what it had already covered, so every
  # boot concluded it had covered nothing and replayed ~3 weeks of hours.
  # The coverage watermark now fixes the replay; this fixes the other symptom,
  # which is that the analysis itself was being written to disposable storage.
  SUBTLETY_APM_REPORT_DIR = "/var/data/apm-reports"
  # Subtlety APM resonance ledger (set SUBTLETY_INGEST_TOKEN via `fly secrets`).
  SUBTLETY_RESONANCE_PATH = "/var/data/subtlety-resonance.jsonl"
  ENABLE_TURBOQUANT = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/health/live"
    timeout = "10s"
    type = "http"

[[vm]]
  size = "shared-cpu-1x"
  # Raised from 512mb on 2026-08-14: headroom while the actual allocator is
  # identified, NOT a fix. A leak fills whatever it is given. See NODE_OPTIONS
  # above — max-old-space is deliberately 768, below the 1024 total, so a heap
  # snapshot has room to be written instead of the kernel OOM-killing the
  # process mid-write.
  memory = "1024mb"

[mounts]
  source = "scholomance_scratch"
  destination = "/var/data"
