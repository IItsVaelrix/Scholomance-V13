name: DivTube Downloader

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r divtube_downloader/requirements-remote.txt

      - name: Run divtube_downloader tests
        working-directory: divtube_downloader
        run: python -m pytest -q

      - name: Run cockpit UI guard rails (tests/tui)
        run: python -m pytest tests/tui -q

      - name: Audit Python dependencies
        working-directory: divtube_downloader
        run: |
          pip install pip-audit
          pip-audit -r requirements-remote.txt

  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build the desktop Java module
        working-directory: divtube_downloader
        run: gradle build
