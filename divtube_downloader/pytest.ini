[pytest]
# Both paths are load-bearing, but neither is a safety net: `testpaths` is
# *ignored* the moment pytest is given an explicit path argument, so
# `pytest divtube_downloader` from the repo root bypasses it entirely.
# divtube_downloader/conftest.py is what actually stops non-test modules from
# being imported and executed.
#
# video_forge/tests was missing from here for the whole life of this file:
# 60 passing tests that `python -m pytest -q` never collected, and that CI
# therefore never ran.
testpaths = tests video_forge/tests
pythonpath = .
